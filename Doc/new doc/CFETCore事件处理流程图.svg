<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1900" viewBox="0 0 1600 1900">
  <defs>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #172033; }
      .section { font: 700 24px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 16px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #172033; }
      .small { font: 14px "Microsoft YaHei", "Segoe UI", sans-serif; fill: #42526b; }
      .box { fill: #ffffff; stroke: #2f5f98; stroke-width: 2; rx: 8; }
      .local { fill: #eef7f1; stroke: #2f855a; }
      .remote { fill: #eef4ff; stroke: #2f5f98; }
      .module { fill: #fff7e6; stroke: #b7791f; }
      .warn { fill: #fff1f2; stroke: #c2410c; }
      .rule { fill: #f8fafc; stroke: #64748b; stroke-dasharray: 6 5; }
      .line { stroke: #344054; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowGrey); }
      .ok { stroke: #2f855a; stroke-width: 2.2; fill: none; marker-end: url(#arrowGreen); }
      .no { stroke: #c2410c; stroke-width: 2.2; fill: none; marker-end: url(#arrowRed); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#344054"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f855a"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1600" height="1900" fill="#f6f8fb"/>
  <text x="60" y="70" class="title">CFETCore 事件处理流程图</text>
  <text x="60" y="105" class="small">本地事件与远程事件分表分发；远程事件必须携带 RemoteHost 并回流到 EventHub.ReceiveRemoteEvent。</text>

  <!-- Section 1 -->
  <text x="60" y="165" class="section">1. 总览</text>
  <rect x="60" y="190" width="1480" height="250" class="box"/>
  <rect x="100" y="260" width="190" height="70" class="box local"/>
  <text x="195" y="288" text-anchor="middle" class="label">Thing / 业务代码</text>
  <text x="195" y="313" text-anchor="middle" class="small">Publish / Subscribe</text>
  <rect x="390" y="245" width="210" height="100" class="box"/>
  <text x="495" y="282" text-anchor="middle" class="label">EventHub</text>
  <text x="495" y="307" text-anchor="middle" class="small">订阅、过滤、分发</text>
  <rect x="710" y="245" width="230" height="100" class="box module"/>
  <text x="825" y="278" text-anchor="middle" class="label">CommunicationManager</text>
  <text x="825" y="305" text-anchor="middle" class="small">按 protocol 查找模块</text>
  <rect x="1050" y="245" width="230" height="100" class="box remote"/>
  <text x="1165" y="278" text-anchor="middle" class="label">IEventCommunicationModule</text>
  <text x="1165" y="305" text-anchor="middle" class="small">远程订阅与事件接收</text>
  <rect x="1325" y="210" width="175" height="60" class="box remote"/>
  <text x="1412" y="245" text-anchor="middle" class="label">远端 EventHub</text>
  <rect x="1325" y="330" width="175" height="60" class="box local"/>
  <text x="1412" y="355" text-anchor="middle" class="label">业务 handler</text>
  <text x="1412" y="378" text-anchor="middle" class="small">由 EventHub 调用</text>
  <path d="M 290 295 L 390 295" class="line"/>
  <path d="M 600 295 L 710 295" class="line"/>
  <path d="M 940 295 L 1050 295" class="line"/>
  <path d="M 1280 270 C 1320 250 1290 240 1325 240" class="dashed"/>
  <text x="1305" y="220" text-anchor="middle" class="small">远程订阅</text>
  <path d="M 1325 240 C 1280 230 1325 320 1280 325" class="dashed"/>
  <text x="1375" y="300" text-anchor="middle" class="small">远程事件推送</text>
  <path d="M 1050 340 C 820 420 600 420 495 345" class="dashed"/>
  <text x="760" y="405" text-anchor="middle" class="small">RegisterEventCallback -> EventHub.ReceiveRemoteEvent</text>
  <path d="M 600 342 C 825 430 1190 430 1325 370" class="line"/>
  <text x="1000" y="455" text-anchor="middle" class="small">EventHub 统一分发本地/远程 handler</text>

  <!-- Section 2 -->
  <text x="60" y="510" class="section">2. 本地事件流程</text>
  <rect x="60" y="535" width="1480" height="220" class="box"/>
  <rect x="100" y="610" width="150" height="60" class="box local"/>
  <text x="175" y="646" text-anchor="middle" class="label">Thing</text>
  <rect x="330" y="595" width="200" height="90" class="box"/>
  <text x="430" y="628" text-anchor="middle" class="label">EventHub.Publish</text>
  <text x="430" y="653" text-anchor="middle" class="small">只表示本地事件</text>
  <rect x="610" y="595" width="190" height="90" class="box local"/>
  <text x="705" y="628" text-anchor="middle" class="label">localEventQueue</text>
  <text x="705" y="653" text-anchor="middle" class="small">本地事件队列</text>
  <rect x="880" y="595" width="230" height="90" class="box local"/>
  <text x="995" y="622" text-anchor="middle" class="label">localSubDict</text>
  <text x="995" y="648" text-anchor="middle" class="small">或 localRouteTable</text>
  <rect x="1190" y="595" width="160" height="90" class="box"/>
  <text x="1270" y="628" text-anchor="middle" class="label">Predicate</text>
  <text x="1270" y="653" text-anchor="middle" class="small">source/type</text>
  <rect x="1410" y="610" width="100" height="60" class="box local"/>
  <text x="1460" y="646" text-anchor="middle" class="label">handler</text>
  <path d="M 250 640 L 330 640" class="line"/>
  <path d="M 530 640 L 610 640" class="line"/>
  <path d="M 800 640 L 880 640" class="line"/>
  <path d="M 1110 640 L 1190 640" class="line"/>
  <path d="M 1350 640 L 1410 640" class="line"/>
  <rect x="920" y="705" width="430" height="34" class="rule"/>
  <text x="1135" y="728" text-anchor="middle" class="small">隔离规则：Publish 不触发 remoteSubDict</text>

  <!-- Section 3 -->
  <text x="60" y="825" class="section">3. 远程订阅建立</text>
  <rect x="60" y="850" width="1480" height="270" class="box"/>
  <rect x="100" y="950" width="150" height="60" class="box remote"/>
  <text x="175" y="986" text-anchor="middle" class="label">订阅端 Thing</text>
  <rect x="315" y="930" width="220" height="100" class="box"/>
  <text x="425" y="962" text-anchor="middle" class="label">EventHub.Subscribe</text>
  <text x="425" y="988" text-anchor="middle" class="small">remoteFilter + handler</text>
  <rect x="605" y="930" width="210" height="100" class="box remote"/>
  <text x="710" y="956" text-anchor="middle" class="label">remoteSubDict</text>
  <text x="710" y="982" text-anchor="middle" class="small">保存 token/filter/handler</text>
  <text x="710" y="1008" text-anchor="middle" class="small">更新 remoteRouteTable</text>
  <rect x="885" y="930" width="240" height="100" class="box module"/>
  <text x="1005" y="956" text-anchor="middle" class="label">CommunicationManager</text>
  <text x="1005" y="982" text-anchor="middle" class="small">GetModuleForEvent</text>
  <text x="1005" y="1008" text-anchor="middle" class="small">protocol -> IEventCM</text>
  <rect x="1195" y="930" width="280" height="100" class="box remote"/>
  <text x="1335" y="956" text-anchor="middle" class="label">IEventCommunicationModule</text>
  <text x="1335" y="982" text-anchor="middle" class="small">Subscribe(token, filter)</text>
  <text x="1335" y="1008" text-anchor="middle" class="small">建立远程订阅</text>
  <path d="M 250 980 L 315 980" class="line"/>
  <path d="M 535 980 L 605 980" class="line"/>
  <path d="M 815 980 L 885 980" class="line"/>
  <path d="M 1125 980 L 1195 980" class="line"/>
  <rect x="610" y="1060" width="600" height="36" class="rule"/>
  <text x="910" y="1084" text-anchor="middle" class="small">业务 handler 只保存在 EventHub；通信模块不持有、不调用业务 handler</text>

  <!-- Section 4 -->
  <text x="60" y="1190" class="section">4. 远程事件回流</text>
  <rect x="60" y="1215" width="1480" height="360" class="box"/>
  <rect x="100" y="1320" width="180" height="80" class="box local"/>
  <text x="190" y="1350" text-anchor="middle" class="label">远端 EventHub</text>
  <text x="190" y="1376" text-anchor="middle" class="small">Publish(localEvent)</text>
  <rect x="355" y="1320" width="230" height="80" class="box remote"/>
  <text x="470" y="1348" text-anchor="middle" class="label">远端 IEventCM</text>
  <text x="470" y="1374" text-anchor="middle" class="small">本地事件 handler 被触发</text>
  <rect x="660" y="1320" width="240" height="80" class="box remote"/>
  <text x="780" y="1348" text-anchor="middle" class="label">订阅端 IEventCM</text>
  <text x="780" y="1374" text-anchor="middle" class="small">接收 EventArg</text>
  <rect x="975" y="1320" width="190" height="80" class="box warn"/>
  <text x="1070" y="1348" text-anchor="middle" class="label">Host 校验</text>
  <text x="1070" y="1374" text-anchor="middle" class="small">RemoteHost 必须可信</text>
  <rect x="1235" y="1320" width="250" height="80" class="box"/>
  <text x="1360" y="1348" text-anchor="middle" class="label">EventHub.ReceiveRemoteEvent</text>
  <text x="1360" y="1374" text-anchor="middle" class="small">只处理远程事件</text>
  <path d="M 280 1360 L 355 1360" class="line"/>
  <path d="M 585 1360 L 660 1360" class="line"/>
  <path d="M 900 1360 L 975 1360" class="line"/>
  <path d="M 1165 1360 L 1235 1360" class="line"/>
  <rect x="345" y="1460" width="290" height="70" class="box remote"/>
  <text x="490" y="1488" text-anchor="middle" class="label">remoteSubDict / remoteRouteTable</text>
  <text x="490" y="1514" text-anchor="middle" class="small">按 host/source/type 定位候选订阅</text>
  <rect x="730" y="1460" width="250" height="70" class="box warn"/>
  <text x="855" y="1488" text-anchor="middle" class="label">Host + source + type 匹配</text>
  <text x="855" y="1514" text-anchor="middle" class="small">Host-A 不触发 Host-B</text>
  <rect x="1075" y="1460" width="190" height="70" class="box remote"/>
  <text x="1170" y="1501" text-anchor="middle" class="label">远程订阅 handler</text>
  <path d="M 1360 1400 C 1360 1488 690 1418 635 1495" class="line"/>
  <path d="M 635 1495 L 730 1495" class="line"/>
  <path d="M 980 1495 L 1075 1495" class="line"/>

  <!-- Section 5 -->
  <text x="60" y="1645" class="section">5. 取消订阅与半失败清理</text>
  <rect x="60" y="1670" width="1480" height="180" class="box"/>
  <rect x="100" y="1725" width="160" height="60" class="box"/>
  <text x="180" y="1761" text-anchor="middle" class="label">Token.Dispose</text>
  <rect x="335" y="1725" width="200" height="60" class="box"/>
  <text x="435" y="1761" text-anchor="middle" class="label">EventHub.Unsubscribe</text>
  <rect x="610" y="1725" width="190" height="60" class="box local"/>
  <text x="705" y="1749" text-anchor="middle" class="label">本地 token</text>
  <text x="705" y="1774" text-anchor="middle" class="small">清 local 表/路由</text>
  <rect x="875" y="1710" width="240" height="90" class="box remote"/>
  <text x="995" y="1738" text-anchor="middle" class="label">远程 token</text>
  <text x="995" y="1764" text-anchor="middle" class="small">UnSubScribe(token)</text>
  <text x="995" y="1788" text-anchor="middle" class="small">清 remote 表/路由</text>
  <rect x="1190" y="1710" width="290" height="90" class="box warn"/>
  <text x="1335" y="1738" text-anchor="middle" class="label">半失败规则</text>
  <text x="1335" y="1764" text-anchor="middle" class="small">取消报文失败也清本地映射</text>
  <text x="1335" y="1788" text-anchor="middle" class="small">避免 handler 继续触发</text>
  <path d="M 260 1755 L 335 1755" class="line"/>
  <path d="M 535 1755 L 610 1755" class="ok"/>
  <path d="M 535 1755 C 650 1645 790 1645 875 1755" class="line"/>
  <path d="M 1115 1755 L 1190 1755" class="line"/>
</svg>
